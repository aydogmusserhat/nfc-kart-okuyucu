name: NFC APK oluştur

'on':
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Projeyi al
        uses: actions/checkout@v6
      - name: Java 17 hazırla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 hazırla
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.9'
      - name: Android SDK bileşenlerini kontrol et
        run: |
          test -f settings.gradle || { echo 'Proje dosyaları deponun kökünde olmalı.'; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
      - name: Veri ve yazma onayı testleri
        run: |
          mkdir -p "$RUNNER_TEMP/nfc-check"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/nfc-check" app/src/main/java/com/serhat/nfcreader/Codec.java app/src/main/java/com/serhat/nfcreader/CardWriteGate.java tests/CodecTest.java tests/CardWriteGateTest.java app/src/main/java/com/serhat/nfcreader/CardAnalysis.java tests/CardAnalysisTest.java app/src/main/java/com/serhat/nfcreader/ByteDecoder.java tests/ByteDecoderTest.java
          java -cp "$RUNNER_TEMP/nfc-check" com.serhat.nfcreader.CodecTest
          java -cp "$RUNNER_TEMP/nfc-check" com.serhat.nfcreader.CardWriteGateTest
          java -cp "$RUNNER_TEMP/nfc-check" com.serhat.nfcreader.CardAnalysisTest
          java -cp "$RUNNER_TEMP/nfc-check" com.serhat.nfcreader.ByteDecoderTest
      - name: APK oluştur
        run: gradle --no-daemon assembleDebug
      - name: APK dosyasını indirmeye aç
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Kart-Okuyucu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
